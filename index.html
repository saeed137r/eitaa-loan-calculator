<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاسبه‌گر اقساط وام</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      color: #1a1a1a;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0d6efd;
    }

    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #0d6efd;
    }

    .quick-rates {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .rate-btn {
      flex: 1;
      min-width: 60px;
      padding: 8px 0;
      border: 1.5px solid #0d6efd;
      background: white;
      color: #0d6efd;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rate-btn.active {
      background: #0d6efd;
      color: white;
    }

    .calculate-btn {
      width: 100%;
      padding: 14px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .calculate-btn:active {
      background: #0b5ed7;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-size: 14px;
      color: #555;
    }

    .result-value {
      font-size: 16px;
      font-weight: 700;
      color: #0d6efd;
    }

    .result-value.big {
      font-size: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }

    .close-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.05);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.Eitaa?.WebApp?.close()">✕</button>

  <div class="container">
    <div class="header">
      <h1>محاسبه‌گر اقساط وام</h1>
      <p>محاسبه سریع قسط ماهانه و سود</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label>مبلغ وام (تومان)</label>
        <input type="number" id="amount" placeholder="مثلاً 500000000" value="500000000">
      </div>

      <div class="form-group">
        <label>مدت بازپرداخت (ماه)</label>
        <input type="number" id="months" placeholder="مثلاً 36" value="36">
      </div>

      <div class="form-group">
        <label>نرخ سود سالانه (درصد)</label>
        <input type="number" id="rate" placeholder="مثلاً 23" value="23" step="0.1">
        <div class="quick-rates">
          <button class="rate-btn" onclick="setRate(18)">۱۸٪</button>
          <button class="rate-btn active" onclick="setRate(23)">۲۳٪</button>
          <button class="rate-btn" onclick="setRate(25)">۲۵٪</button>
          <button class="rate-btn" onclick="setRate(28)">۲۸٪</button>
        </div>
      </div>

      <button class="calculate-btn" onclick="calculate()">محاسبه کن</button>
    </div>

    <div class="card result" id="result">
      <div class="result-item">
        <span class="result-label">قسط ماهانه</span>
        <span class="result-value big" id="monthly">—</span>
      </div>
      <div class="result-item">
        <span class="result-label">کل مبلغ بازپرداخت</span>
        <span class="result-value" id="total">—</span>
      </div>
      <div class="result-item">
        <span class="result-label">کل سود پرداختی</span>
        <span class="result-value" id="interest">—</span>
      </div>
    </div>

    <div class="footer">
      ساخته شده برای ایتا
    </div>
  </div>

  <script>
    // بررسی SDK ایتا
    if (window.Eitaa && window.Eitaa.WebApp) {
      console.log("SDK ایتا فعال است");
      // می‌توانید اینجا از قابلیت‌های بیشتر استفاده کنید
      // مثلاً: window.Eitaa.WebApp.expand();
    } else {
      console.log("در حال اجرا خارج از ایتا");
    }

    function setRate(value) {
      document.getElementById('rate').value = value;
      document.querySelectorAll('.rate-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('fa-IR').format(Math.round(num)) + " تومان";
    }

    function calculate() {
      const amount = parseFloat(document.getElementById('amount').value);
      const months = parseInt(document.getElementById('months').value);
      const annualRate = parseFloat(document.getElementById('rate').value);

      if (!amount || !months || !annualRate || amount <= 0 || months <= 0) {
        alert("لطفاً همه مقادیر را به درستی وارد کنید");
        return;
      }

      // فرمول قسط ماهانه (annuity)
      const monthlyRate = annualRate / 100 / 12;
      let monthlyPayment;

      if (monthlyRate === 0) {
        monthlyPayment = amount / months;
      } else {
        monthlyPayment = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
      }

      const totalPayment = monthlyPayment * months;
      const totalInterest = totalPayment - amount;

      document.getElementById('monthly').textContent = formatNumber(monthlyPayment);
      document.getElementById('total').textContent = formatNumber(totalPayment);
      document.getElementById('interest').textContent = formatNumber(totalInterest);

      document.getElementById('result').classList.add('show');
    }

    // محاسبه خودکار در شروع
    calculate();
  </script>
</body>
</html>
